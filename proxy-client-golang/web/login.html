<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="renderer" content="webkit">
    <meta http-equiv="Cache-Control" content="no-siteapp">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="common/css/proxy-beauty.css">
    <script src="/api.js"></script>
    <script src="common/js/jquery.min.js"></script>
    <title>登录 - Proxy内网穿透</title>
    <style>
        .login-page {
            min-height: 100vh;
            background: linear-gradient(135deg, var(--primary-600), var(--primary-800));
            display: flex;
            flex-direction: column;
        }
        
        .login-header {
            padding: 2rem;
            text-align: center;
        }
        
        .login-header h1 {
            color: white;
            font-size: 2rem;
            font-weight: 600;
        }
        
        .login-header p {
            color: rgba(255, 255, 255, 0.8);
            margin-top: 0.5rem;
        }
        
        .login-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        
        .login-card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 400px;
            overflow: hidden;
        }
        
        .login-tabs {
            display: flex;
            border-bottom: 1px solid var(--border);
        }
        
        .login-tab {
            flex: 1;
            padding: 1rem;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            font-weight: 500;
            color: var(--text-secondary);
        }
        
        .login-tab.active {
            color: var(--primary-500);
            border-bottom: 2px solid var(--primary-500);
        }
        
        .login-form {
            padding: 2rem;
        }
        
        .form-footer {
            margin-top: 1.5rem;
            text-align: center;
        }
        
        .feature-section {
            background: var(--bg-card);
            padding: 3rem 2rem;
            border-top: 1px solid var(--border);
        }
        
        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            max-width: 1200px;
            margin: 2rem auto 0;
        }
        
        .feature-item {
            text-align: center;
        }
        
        .feature-item i {
            font-size: 2.5rem;
            color: var(--primary-500);
            margin-bottom: 1rem;
        }
        
        .feature-item h3 {
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        
        .feature-item p {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }
        
        .donation-section {
            background: var(--bg-body);
            padding: 2rem;
            text-align: center;
        }
        
        .donation-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            max-width: 600px;
            margin: 1.5rem auto 0;
        }
        
        .donation-item {
            background: var(--bg-card);
            padding: 1rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
        }
        
        .donation-amount {
            font-weight: 600;
            color: var(--primary-500);
        }
    </style>
</head>
<body>
    <div class="login-page">
        <div class="login-header">
            <h1>Proxy内网穿透</h1>
            <p>简单、快速、免费的内网穿透服务</p>
        </div>
        
        <div class="login-container">
            <div class="login-card">
                <div class="login-tabs">
                    <div class="login-tab active" onclick="showLogin()">登录</div>
                    <div class="login-tab" onclick="showRegister()">注册/更新密码</div>
                </div>
                
                <!-- 登录表单 -->
                <div class="login-form" id="loginForm">
                    <div class="form-group">
                        <label class="form-label">邮箱</label>
                        <input class="form-input" id="login_username" type="text" placeholder="请输入邮箱">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">密码</label>
                        <input class="form-input" id="login_password" type="password" placeholder="请输入密码">
                    </div>
                    
                    <button class="btn btn-primary" style="width: 100%;" id="login_btn">登录</button>
                </div>
                
                <!-- 注册表单 -->
                <div class="login-form" id="registerForm" style="display: none;">
                    <div class="form-group">
                        <label class="form-label">邮箱</label>
                        <input class="form-input" id="reg_username" type="text" placeholder="请输入邮箱">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">密码</label>
                        <input class="form-input" id="reg_password" type="password" placeholder="请输入密码">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">验证码</label>
                        <div style="display: flex; gap: 0.5rem;">
                            <input class="form-input" id="reg_code" type="text" placeholder="请输入验证码" style="flex: 1;">
                            <button class="btn btn-outline" id="send_email" type="button" style="white-space: nowrap;">发送验证码</button>
                        </div>
                    </div>
                    
                    <button class="btn btn-primary" style="width: 100%;" id="reg_btn">注册/更新密码</button>
                </div>
                
                <div class="form-footer text-secondary">
                    永久免费 · 无需充值
                </div>
            </div>
        </div>
        
        <div class="feature-section">
            <h2 style="text-align: center; margin-bottom: 2rem;">为什么选择我们？</h2>
            <div class="feature-grid">
                <div class="feature-item">
                    <i class="material-icons">devices</i>
                    <h3>多端支持</h3>
                    <p>Android、Win、Linux、Mac、NAS、Docker等环境</p>
                </div>
                <div class="feature-item">
                    <i class="material-icons">language</i>
                    <h3>二级域名赠送</h3>
                    <p>注册账号即送二级域名，快速开发调试</p>
                </div>
                <div class="feature-item">
                    <i class="material-icons">dns</i>
                    <h3>固定端口</h3>
                    <p>支持动态端口与固定端口模式</p>
                </div>
                <div class="feature-item">
                    <i class="material-icons">https</i>
                    <h3>HTTPS支持</h3>
                    <p>支持自定义域名SSL证书配置</p>
                </div>
            </div>
        </div>
        
        <div class="donation-section">
            <h3 style="margin-bottom: 1rem;">最新捐赠者</h3>
            <div class="donation-grid" id="pay"></div>
        </div>
    </div>

    <script>
        $(function() {
            var userInfo = localStorage.getItem("userInfo");
            if (userInfo) {
                location.href = "center.html";
            }
            
            loadDonations();
        });

        function showLogin() {
            $(".login-tab").removeClass("active");
            $(".login-tab:eq(0)").addClass("active");
            $("#loginForm").show();
            $("#registerForm").hide();
        }
        
        function showRegister() {
            $(".login-tab").removeClass("active");
            $(".login-tab:eq(1)").addClass("active");
            $("#loginForm").hide();
            $("#registerForm").show();
        }

        $("#login_btn").click(function() {
            let val = $("#login_username").val();
            let val1 = $("#login_password").val();
            if (val && val1) {
                $.post(apiAddress + "/user/login", {username: val, password: val1}, function(result) {
                    if (result.code === 200) {
                        localStorage.setItem("userInfo", JSON.stringify(result.data));
                        if (result.data.level == 0) {
                            localStorage.setItem("showPay", 0);
                        }
                        location.href = "center.html";
                    } else {
                        alert(result.msg);
                    }
                });
            } else {
                alert("请输入邮箱和密码");
            }
        });

        $("#send_email").click(function() {
            let val = $("#reg_username").val();
            if (val) {
                $.get(apiAddress + "/user/email", {username: val}, function(result) {
                    if (result.code === 200) {
                        alert("发送成功，请查收邮件，留意垃圾邮箱");
                    } else {
                        alert(result.msg);
                    }
                });
            } else {
                alert("请输入邮箱");
            }
        });

        $("#reg_btn").click(function() {
            let val = $("#reg_username").val();
            let val1 = $("#reg_password").val();
            let code = $("#reg_code").val();
            if (val && val1 && code) {
                $.post(apiAddress + "/user/reg", {username: val, password: val1, code: code}, function(result) {
                    if (result.code === 200) {
                        alert(result.msg);
                        showLogin();
                    } else {
                        alert(result.msg);
                    }
                });
            } else {
                alert("请填写完整信息");
            }
        });

        function loadDonations() {
            $.get(apiAddress + "/server/pay", function(result) {
                if (result.code !== 200) return;
                
                var tabData = "";
                for (let a of result.data) {
                    tabData += '<div class="donation-item">' +
                        '<div>' + a.username + '</div>' +
                        '<div class="donation-amount">￥' + a.price + '</div>' +
                        '</div>';
                }
                $("#pay").html(tabData || '<div class="donation-item">暂无捐赠记录</div>');
            });
        }
    </script>
</body>
</html>
