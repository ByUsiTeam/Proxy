<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="renderer" content="webkit">
    <meta http-equiv="Cache-Control" content="no-siteapp">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="common/css/proxy-beauty.css">
    <script src="/api.js"></script>
    <script src="common/js/jquery.min.js"></script>
    <title>穿透服务 - Proxy内网穿透</title>
</head>
<body>
    <header class="app-header">
        <button class="menu-toggle" id="menuToggle">
            <i class="material-icons">menu</i>
        </button>
        <a href="center.html" class="logo">Proxy<span>内网穿透</span></a>
        <div class="header-spacer"></div>
        <div class="user-info">
            <span class="user-badge" id="userInfoDisplay">
                <span id="username">***</span> · <span id="level">***</span>
            </span>
            <button class="logout-btn" id="login_out">退出</button>
        </div>
    </header>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    
    <aside class="sidebar" id="sidebar">
        <nav class="sidebar-nav">
            <a href="center.html" class="nav-item active">
                <i class="material-icons">near_me</i>
                <span>穿透服务</span>
            </a>
            <a href="port.html" class="nav-item">
                <i class="material-icons">dns</i>
                <span>端口管理</span>
            </a>
            <a href="domain.html" class="nav-item">
                <i class="material-icons">language</i>
                <span>域名管理</span>
            </a>
            <a href="autoproxy.html" class="nav-item">
                <i class="material-icons">autorenew</i>
                <span>自动穿透</span>
            </a>
            <a href="log.html" class="nav-item">
                <i class="material-icons">history</i>
                <span>穿透日志</span>
            </a>
        </nav>
    </aside>

    <main class="main-content" id="mainContent">
        <div class="flex gap-2 mb-4">
            <button class="btn btn-primary" onclick="openAddDialog()">
                <i class="material-icons" style="font-size: 1.25rem;">add</i>
                添加穿透
            </button>
            <button class="btn btn-outline" id="checkCore">
                <i class="material-icons" style="font-size: 1.25rem;">info</i>
                检查内核
            </button>
            <button class="btn btn-outline" id="refUser">
                <i class="material-icons" style="font-size: 1.25rem;">refresh</i>
                刷新配置
            </button>
        </div>

        <div class="card">
            <div class="card-header">
                <h3 class="card-title">穿透服务列表</h3>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>域名</th>
                                <th>内网服务</th>
                                <th>穿透服务</th>
                                <th>状态</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="tabData"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h3 class="card-title">实时日志</h3>
            </div>
            <div class="card-body">
                <ul class="log-list" id="log"></ul>
            </div>
        </div>
    </main>

    <!-- 添加穿透服务对话框 -->
    <div class="modal" id="addModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">添加穿透服务</h3>
                <button class="modal-close" onclick="closeAddDialog()">&times;</button>
            </div>
            <form id="handle-form">
                <div class="modal-body">
                    <input type="hidden" id="password" name="password">
                    <input type="hidden" id="usernameFrom" name="username">
                    
                    <div class="form-group">
                        <label class="form-label">内网IP</label>
                        <input class="form-input" name="ip" placeholder="内网IP" type="text">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">内网端口</label>
                        <input class="form-input" name="port" placeholder="内网端口" type="text">
                    </div>

                    <div class="form-group">
                        <label class="form-label">穿透类型</label>
                        <div class="radio-group">
                            <label class="radio-label">
                                <input type="radio" value="TCP" name="type" checked> TCP
                            </label>
                            <label class="radio-label">
                                <input type="radio" value="UDP" name="type"> UDP
                            </label>
                            <label class="radio-label">
                                <input type="radio" value="TCP_UDP" name="type"> TCP+UDP
                            </label>
                        </div>
                    </div>

                    <div class="form-group" id="server_data">
                        <label class="form-label">穿透服务选择</label>
                    </div>

                    <div style="display: none;" class="form-group" id="showServerInfoInPut">
                        <label class="form-label">自定义穿透服务</label>
                        <input class="form-input" id="showServerInfoInPutVal" placeholder="ip:端口" type="text">
                    </div>

                    <div class="form-group" id="domains"></div>
                    <div class="form-group" id="ports"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline" onclick="closeAddDialog()">取消</button>
                    <button type="button" class="btn btn-primary" id="add_btn">确定</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 打赏对话框 -->
    <div class="modal" id="payModal">
        <div class="modal-content" style="max-width: 400px;">
            <div class="modal-header">
                <h3 class="modal-title">支持我们</h3>
                <button class="modal-close" onclick="closePayDialog()">&times;</button>
            </div>
            <div class="modal-body" style="text-align: center;">
                <img height="300" src="img/pay.jpg" style="max-width: 100%;" onerror="this.src='https://via.placeholder.com/300x400?text=请打赏'">
                <p class="mt-4 text-secondary">打赏请备注账号</p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="closePayDialog()">关闭</button>
            </div>
        </div>
    </div>

    <script>
        // 全局变量
        var userInfo = null;
        var ws = null;

        $(function() {
            // 检查登录状态
            var storedUserInfo = localStorage.getItem("userInfo");
            if (!storedUserInfo) {
                location.href = "login.html";
                return;
            }
            
            userInfo = JSON.parse(storedUserInfo);
            $("#username").text(userInfo.username || "***");
            $("#level").text(userInfo.level || "***");
            
            // 显示提示信息
            if (userInfo.tips) {
                alert(userInfo.tips);
            }
            
            // 退出登录
            $("#login_out").click(function() {
                localStorage.removeItem("userInfo");
                location.href = "login.html";
            });

            // 侧边栏控制
            $("#menuToggle").click(function() {
                $("#sidebar").toggleClass("open");
                $("#sidebarOverlay").toggleClass("active");
            });

            $("#sidebarOverlay").click(function() {
                $("#sidebar").removeClass("open");
                $("#sidebarOverlay").removeClass("active");
            });

            // 检查内核版本
            $("#checkCore").click(function() {
                $.get("/core/version", function(result) {
                    alert(result.Msg || "未知版本");
                }).fail(function() {
                    alert("获取版本失败");
                });
            });

            // 刷新用户信息
            $("#refUser").click(function() {
                $.post(apiAddress + "/user/login", {username: userInfo.username, password: userInfo.password}, function(result) {
                    if (result.code === 200) {
                        localStorage.setItem("userInfo", JSON.stringify(result.data));
                        location.reload();
                    } else {
                        alert(result.msg || "刷新失败");
                    }
                }).fail(function() {
                    alert("网络错误");
                });
            });

            // 显示打赏弹窗
            var showPay = localStorage.getItem("showPay");
            if (showPay == 0) {
                setTimeout(function() {
                    openPayDialog();
                }, 500);
                localStorage.setItem("showPay", "1");
            }

            // 初始化表单和加载数据
            initForm();
            loadServerList();
            initWebSocket();
        });

        function openAddDialog() {
            $("#addModal").addClass("open");
        }

        function closeAddDialog() {
            $("#addModal").removeClass("open");
        }

        function openPayDialog() {
            $("#payModal").addClass("open");
        }

        function closePayDialog() {
            $("#payModal").removeClass("open");
        }

        function initForm() {
            if (!userInfo) return;
            
            $("#password").val(userInfo.password || "");
            $("#usernameFrom").val(userInfo.username || "");

            // 域名选项
            var domainHtml = '<label class="form-label">穿透域名</label><div class="radio-group">';
            if (userInfo.domains && Object.keys(userInfo.domains).length > 0) {
                for (let a of Object.keys(userInfo.domains)) {
                    domainHtml += '<label class="radio-label">' +
                        '<input type="radio" value="' + a + '" name="domain"> ' + a +
                        '</label>';
                }
            } else {
                domainHtml += '<span class="text-secondary">暂无可用域名</span>';
            }
            domainHtml += '</div>';
            $("#domains").html(domainHtml);

            // 端口选项
            var portsHtml = '<label class="form-label">外网端口号</label><div class="radio-group">' +
                '<label class="radio-label">' +
                '<input type="radio" value="0" name="remote_port"> 随机端口' +
                '</label>';
            if (userInfo.ports && userInfo.ports.length > 0) {
                for (let a of userInfo.ports) {
                    portsHtml += '<label class="radio-label">' +
                        '<input type="radio" value="' + a + '" name="remote_port"> ' + a +
                        '</label>';
                }
            }
            portsHtml += '</div>';
            $("#ports").html(portsHtml);

            // 服务选项
            $.get(apiAddress + "/load/data", function(result) {
                var serverData = (result.code === 200 && result.data) ? result.data : [];
                var serverDataHtml = '<label class="form-label">穿透服务选择</label><div class="radio-group">';
                
                for (let a of serverData) {
                    serverDataHtml += '<label class="radio-label">' +
                        '<input type="radio" value="' + a.ip + ':' + a.port + '" name="server_info"> ' +
                        a.name + ' (在线:' + (a.num || 0) + ')' +
                        '</label>';
                }
                serverDataHtml += '<label class="radio-label">' +
                    '<input type="radio" value="-1" name="server_info"> 自定义服务' +
                    '</label></div>';
                
                $("#server_data").html(serverDataHtml);

                // 绑定事件
                $("input[name='server_info']").on("click", function() {
                    if ($(this).val() == -1) {
                        $("#showServerInfoInPut").show();
                    } else {
                        $("#showServerInfoInPut").hide();
                    }
                });

                $("input[name='type']").on("click", function() {
                    if ($(this).val() == 'UDP') {
                        $("#domains").hide();
                    } else {
                        $("#domains").show();
                    }
                });
            }).fail(function() {
                $("#server_data").html('<div class="text-secondary">加载服务列表失败</div>');
            });
        }

        function loadServerList() {
            $.get("/server/info", function(result) {
                var tabData = "";
                if (result && result.length > 0) {
                    for (let a of result) {
                        let statusClass = a.Status === '运行中' ? 'badge-success' : 'badge-danger';
                        tabData += '<tr>' +
                            '<td>' + (a.Domain || '-') + '</td>' +
                            '<td>' + (a.ProxyServer || '-') + '</td>' +
                            '<td>' + (a.Server || '-') + '</td>' +
                            '<td><span class="badge ' + statusClass + '">' + (a.Status || '未知') + '</span></td>' +
                            '<td>' +
                            '<button class="btn btn-danger btn-sm" onclick="stopServer(\'' + (a.Domain || '') + '\')">' +
                            '<i class="material-icons" style="font-size: 1.25rem;">stop</i> 停止' +
                            '</button>' +
                            '</td>' +
                            '</tr>';
                    }
                } else {
                    tabData = '<tr><td colspan="5" style="text-align: center; padding: 2rem;">暂无数据</td></tr>';
                }
                $("#tabData").html(tabData);
            }).fail(function() {
                $("#tabData").html('<tr><td colspan="5" style="text-align: center; padding: 2rem;">加载失败</td></tr>');
            });
        }

        function stopServer(domain) {
            if (!domain) {
                alert("无效的域名");
                return;
            }
            if (confirm("确定要停止这个穿透服务吗？")) {
                $.get("/server/stop?domain=" + domain, function(result) {
                    alert(result.Msg || "操作成功");
                    loadServerList();
                }).fail(function() {
                    alert("操作失败");
                });
            }
        }

        $("#add_btn").click(function() {
            let serialize = $("#handle-form").serializeArray();
            
            // 处理自定义服务
            for (let a of serialize) {
                if (a.name == 'server_info' && a.value == '-1') {
                    a.value = $("#showServerInfoInPutVal").val();
                    if (!a.value) {
                        alert("请输入自定义服务地址");
                        return;
                    }
                }
            }
            
            // 验证必填项
            var hasIp = false, hasPort = false;
            for (let a of serialize) {
                if (a.name == 'ip' && a.value) hasIp = true;
                if (a.name == 'port' && a.value) hasPort = true;
            }
            if (!hasIp || !hasPort) {
                alert("请填写内网IP和端口");
                return;
            }
            
            $.post("/server/proxy", serialize, function(result) {
                if (result.Code === 200) {
                    alert(result.Msg || "添加成功");
                    closeAddDialog();
                    loadServerList();
                } else {
                    alert(result.Msg || "添加失败");
                }
            }).fail(function() {
                alert("网络错误");
            });
        });

        function initWebSocket() {
            try {
                ws = new WebSocket("ws://" + window.location.host + "/ws");
                ws.onmessage = function(evt) {
                    try {
                        var result = JSON.parse(evt.data);
                        $("#log").prepend(
                            '<li class="log-item">' +
                            '<div class="log-title">' + (result.Domain || '系统') + '</div>' +
                            '<div class="log-message">' + (result.Msg || evt.data) + '</div>' +
                            '</li>'
                        );
                        // 限制日志条数
                        if ($(".log-item").length > 50) {
                            $(".log-item:gt(49)").remove();
                        }
                    } catch (e) {
                        console.log("WebSocket消息解析失败", e);
                    }
                };
                ws.onerror = function() {
                    console.log("WebSocket连接错误");
                };
            } catch (e) {
                console.log("WebSocket初始化失败", e);
            }
        }
    </script>
</body>
</html>
