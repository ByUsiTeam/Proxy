<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="renderer" content="webkit">
    <meta http-equiv="Cache-Control" content="no-siteapp">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="common/css/proxy-beauty.css">
    <script src="/api.js"></script>
    <script src="common/js/jquery.min.js"></script>
    <title>穿透日志 - Proxy内网穿透</title>
</head>
<body>
    <header class="app-header">
        <button class="menu-toggle" id="menuToggle">
            <i class="material-icons">menu</i>
        </button>
        <a href="center.html" class="logo">Proxy<span>内网穿透</span></a>
        <div class="header-spacer"></div>
        <div class="user-info">
            <span class="user-badge" id="userInfoDisplay">
                <span id="username">***</span> · <span id="level">***</span>
            </span>
            <button class="logout-btn" id="login_out">退出</button>
        </div>
    </header>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    
    <aside class="sidebar" id="sidebar">
        <nav class="sidebar-nav">
            <a href="center.html" class="nav-item">
                <i class="material-icons">near_me</i>
                <span>穿透服务</span>
            </a>
            <a href="port.html" class="nav-item">
                <i class="material-icons">dns</i>
                <span>端口管理</span>
            </a>
            <a href="domain.html" class="nav-item">
                <i class="material-icons">language</i>
                <span>域名管理</span>
            </a>
            <a href="autoproxy.html" class="nav-item">
                <i class="material-icons">autorenew</i>
                <span>自动穿透</span>
            </a>
            <a href="log.html" class="nav-item active">
                <i class="material-icons">history</i>
                <span>穿透日志</span>
            </a>
        </nav>
    </aside>

    <main class="main-content" id="mainContent">
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">流量统计</h3>
                <button class="btn btn-outline btn-sm" onclick="refreshLog()">
                    <i class="material-icons" style="font-size: 1.25rem;">refresh</i>
                    刷新
                </button>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>用户名</th>
                                <th>端口</th>
                                <th>接收流量</th>
                                <th>发送流量</th>
                                <th>连接数</th>
                                <th>数据包数</th>
                                <th>时间</th>
                            </tr>
                        </thead>
                        <tbody id="tabData"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script>
        // 全局变量
        var userInfo = null;

        $(function() {
            // 检查登录状态
            var storedUserInfo = localStorage.getItem("userInfo");
            if (!storedUserInfo) {
                location.href = "login.html";
                return;
            }
            
            userInfo = JSON.parse(storedUserInfo);
            $("#username").text(userInfo.username || "***");
            $("#level").text(userInfo.level || "***");
            
            // 退出登录
            $("#login_out").click(function() {
                localStorage.removeItem("userInfo");
                location.href = "login.html";
            });

            // 侧边栏控制
            $("#menuToggle").click(function() {
                $("#sidebar").toggleClass("open");
                $("#sidebarOverlay").toggleClass("active");
            });

            $("#sidebarOverlay").click(function() {
                $("#sidebar").removeClass("open");
                $("#sidebarOverlay").removeClass("active");
            });

            // 加载日志数据
            loadLogData();
        });

        function refreshLog() {
            loadLogData();
        }

        function loadLogData() {
            if (!userInfo || !userInfo.username) return;
            
            $.get(apiAddress + "/statistics/getMyInfo?username=" + encodeURIComponent(userInfo.username) + "&page=1", function(result) {
                var tabData = "";
                if (result.code === 200 && result.data && result.data.list && result.data.list.length > 0) {
                    for (let a of result.data.list) {
                        tabData += '<tr>' +
                            '<td>' + (a.id || '-') + '</td>' +
                            '<td>' + (a.username || '-') + '</td>' +
                            '<td>' + (a.port || '-') + '</td>' +
                            '<td>' + formatBytes(a.receive || 0) + '</td>' +
                            '<td>' + formatBytes(a.send || 0) + '</td>' +
                            '<td>' + (a.connectNum || 0) + '</td>' +
                            '<td>' + (a.packNum || 0) + '</td>' +
                            '<td>' + (a.createTime || '-') + '</td>' +
                            '</tr>';
                    }
                } else {
                    tabData = '<tr><td colspan="8" style="text-align: center; padding: 2rem;">暂无数据</td></tr>';
                }
                $("#tabData").html(tabData);
            }).fail(function() {
                $("#tabData").html('<tr><td colspan="8" style="text-align: center; padding: 2rem;">加载失败</td></tr>');
            });
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            if (!bytes) return '0 B';
            
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
    </script>
</body>
</html>
