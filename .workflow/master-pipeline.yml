version: '1.0'
name: master-pipeline
displayName: Build
triggers:
  trigger: auto
  push:
    branches:
      include:
        - master
stages:
  - name: compile
    displayName: 编译
    strategy: naturally
    trigger: auto
    steps:
      - step: build@maven
        name: build_maven
        displayName: Maven 构建
        jdkVersion: '17'
        mavenVersion: 3.9.6
        commands:
          - mvn -B clean package
        artifacts:
          - name: BUILD_ARTIFACT
            path:
              - ./target
        strategy: {}
      - step: publish@general_artifacts
        name: u1
        displayName: 上传制品
        dependArtifact: BUILD_ARTIFACT
        artifactName: output
        notify: []
        strategy:
          retry: '0'
        dependsOn: build_maven
      - step: build@golang
        name: build_golang_2
        displayName: Golang 构建
        golangVersion: '1.22'
        commands:
          - echo "正在编译Windows的AMD64版Proxy穿透客户端...."
          - export CGO_ENABLED=0
          - export GOOS=windows
          - export GOARCH=amd64
          - go build -o build/proxy-client.exe main.go
          - echo "编译成功"
          - ''
          - echo "正在编译Windows的ARM64版Proxy穿透客户端...."
          - export CGO_ENABLED=0
          - export GOOS=windows
          - export GOARCH=arm64
          - go build -o build/proxy-client-arm64.exe main.go
          - echo "编译成功"
          - ''
          - echo "正在编译Linux的AMD64版Proxy穿透客户端...."
          - export CGO_ENABLED=0
          - export GOOS=linux
          - export GOARCH=amd64
          - go build -o build/proxy-client-amd64 main.go
          - echo "编译成功"
          - ''
          - echo "正在编译MacOS的AMD64版Proxy穿透客户端...."
          - export CGO_ENABLED=0
          - export GOOS=darwin
          - export GOARCH=amd64
          - go build -o build/proxy-client-apple-amd64 main.go
          - echo "编译成功"
          - ''
          - echo "正在编译MacOS的ARM64版Proxy穿透客户端...."
          - export CGO_ENABLED=0
          - export GOOS=darwin
          - export GOARCH=arm64
          - go build -o build/proxy-client-apple-arm64 main.go
          - echo "编译成功"
          - ''
          - echo "正在编译Linux的ARM64版Proxy穿透客户端...."
          - export CGO_ENABLED=0
          - export GOOS=linux
          - export GOARCH=arm64
          - go build -o build/proxy-client-arm64 main.go
          - echo "编译成功"
          - ''
          - echo "正在编译Linux的ARMv7版Proxy穿透客户端...."
          - export CGO_ENABLED=0
          - export GOOS=linux
          - export GOARCH=arm
          - export GOARM=7
          - go build -o build/proxy-client-armv7 main.go
          - echo "编译成功"
          - ''
          - echo "正在编译Linux的Mipsle版Proxy穿透客户端...."
          - export CGO_ENABLED=0
          - export GOOS=linux
          - export GOARCH=mipsle
          - go build -o build/proxy-client-mips main.go
          - echo "编译成功"
          - ''
          - echo "正在编译Android的ARM64版Proxy穿透...."
          - export CGO_ENABLED=0
          - export GOOS=android
          - export GOARCH=arm64
          - go build -o build/proxy-client-android main.go
          - echo "编译成功"
          - echo "编译完成✅"
        artifacts:
          - name: BUILD_ARTIFACT
            path:
              - ./proxy-client-golang
        caches:
          - ./proxy-client-golang/build/proxy-client.exe
          - ./proxy-client-golang/build/proxy-client-arm64.exe
          - ./proxy-client-golang/build/proxy-client-amd64
          - ./proxy-client-golang/build/proxy-client-apple-amd64
          - ./proxy-client-golang/build/proxy-client-apple-arm64
          - ./proxy-client-golang/build/proxy-client-arm64
          - ./proxy-client-golang/build/proxy-client-armv7
          - ./proxy-client-golang/build/proxy-client-mips
          - ./proxy-client-golang/build/proxy-client-android
        notify: []
        strategy:
          retry: '0'
      - step: publish@general_artifacts
        name: u2
        displayName: 上传制品
        dependArtifact: BUILD_ARTIFACT
        artifactName: output
        notify: []
        strategy:
          retry: '0'
        dependsOn: build_golang_2
  - name: release
    displayName: 发布
    strategy: naturally
    trigger: auto
    steps:
      - step: publish@release_artifacts
        name: publish_release_artifacts
        displayName: 发布
        dependArtifact: output
        version: 1.0.0.0
        autoIncrement: true
        strategy: {}
